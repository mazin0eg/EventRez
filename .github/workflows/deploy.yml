name: CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and push Backend
      uses: docker/build-push-action@v6
      with:
        context: ./EventRev_backend
        file: ./EventRev_backend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/eventrez-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Frontend
      uses: docker/build-push-action@v6
      with:
        context: ./EventRev_frontend
        file: ./EventRev_frontend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/eventrez-frontend:latest
        build-args: |
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        script: |
          mkdir -p ~/eventrez
          cd ~/eventrez
          
          # Create .env file
          cat > .env << 'ENVEOF'
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=7d
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          ENVEOF
          
          # Login to Docker Hub
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
          
          # Create docker-compose file
          cat > docker-compose.yml << 'COMPOSEEOF'
          version: '3.8'
          
          services:
            postgres:
              image: postgres:15-alpine
              container_name: eventrez-db
              restart: unless-stopped
              environment:
                POSTGRES_USER: ${DB_USERNAME}
                POSTGRES_PASSWORD: ${DB_PASSWORD}
                POSTGRES_DB: ${DB_DATABASE}
              volumes:
                - postgres_data:/var/lib/postgresql/data
              networks:
                - eventrez-network
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U postgres"]
                interval: 10s
                timeout: 5s
                retries: 5
          
            backend:
              image: ${{ secrets.DOCKER_HUB_USERNAME }}/eventrez-backend:latest
              container_name: eventrez-backend
              restart: unless-stopped
              environment:
                NODE_ENV: production
                PORT: 3000
                DB_HOST: postgres
                DB_PORT: 5432
                DB_USERNAME: ${DB_USERNAME}
                DB_PASSWORD: ${DB_PASSWORD}
                DB_DATABASE: ${DB_DATABASE}
                JWT_SECRET: ${JWT_SECRET}
                JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
              ports:
                - "3000:3000"
              depends_on:
                postgres:
                  condition: service_healthy
              networks:
                - eventrez-network
          
            frontend:
              image: ${{ secrets.DOCKER_HUB_USERNAME }}/eventrez-frontend:latest
              container_name: eventrez-frontend
              restart: unless-stopped
              environment:
                NODE_ENV: production
              ports:
                - "3001:3000"
              depends_on:
                - backend
              networks:
                - eventrez-network
          
          networks:
            eventrez-network:
              driver: bridge
          
          volumes:
            postgres_data:
          COMPOSEEOF
          
          # Pull and deploy
          docker compose pull
          docker compose up -d
          docker image prune -f
          
          echo "Deployment complete!"
